packages:
  - 'apps/*'
  - 'packages/*'
  - 'contracts'

allowBuilds:
  '@google/genai': true
  '@tailwindcss/oxide': true
  bigint-buffer: true
  bufferutil: false
  protobufjs: true
  re2: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false

onlyBuiltDependencies:
  - '@google/genai'
  - '@tailwindcss/oxide'
  - 'bigint-buffer'
  - 'protobufjs'
  - 're2'
  - 'sharp'
  - 'unrs-resolver'
