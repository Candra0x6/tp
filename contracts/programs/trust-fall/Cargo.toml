[package]
name = "trust-fall"
version = "0.1.0"
description = "Trust Fall Anchor Program for MagicBlock Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "trust_fall"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2" }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf", "access-control"] }

[profile.release]
overflow-checks = true
